[project]
name = "bagman"
version = "0.1.0"
description = "Finds open class action settlements you qualify for, using evidence from your email, and files claims after you confirm them."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "feedparser>=6.0",
  "beautifulsoup4>=4.12",
  "google-api-python-client>=2.120",
  "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
filer = ["playwright>=1.44"]
dev = ["pytest>=8"]

[project.scripts]
bagman = "bagman.cli:main"

[tool.setuptools.packages.find]
include = ["bagman*"]

[tool.setuptools.package-data]
bagman = ["templates/*.html"]
